# Builds the iPhone app on a Mac runner.
# Without Apple secrets it compiles for the iOS Simulator (proves the build works).
# With an Apple Developer account and the secrets below it uploads to TestFlight.
name: iPhone app
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    env:
      CERT_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx cap add ios
      - run: npx capacitor-assets generate --ios
      - run: npx cap sync ios
      - name: Simulator build (no signing)
        if: env.CERT_BASE64 == ''
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -sdk iphonesimulator -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          cd build/Build/Products/Release-iphonesimulator && zip -qry $GITHUB_WORKSPACE/AggregateQuote-simulator.zip App.app
      - uses: actions/upload-artifact@v4
        if: env.CERT_BASE64 == ''
        with:
          name: AggregateQuote-ios-simulator
          path: AggregateQuote-simulator.zip

      # ---- TestFlight (needs Apple Developer Program + these repository secrets) ----
      # IOS_CERTIFICATE_BASE64, IOS_CERTIFICATE_PASSWORD   Apple Distribution certificate (.p12)
      # IOS_PROFILE_BASE64, IOS_PROFILE_NAME               App Store provisioning profile for com.aggregatequote.app
      # IOS_TEAM_ID                                        10-character Team ID
      # ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_BASE64          App Store Connect API key (.p8)
      - name: Install signing certificate and profile
        if: env.CERT_BASE64 != ''
        run: |
          KC=$RUNNER_TEMP/build.keychain-db; KP=$(uuidgen)
          echo "$CERT_BASE64" | base64 -d > $RUNNER_TEMP/cert.p12
          echo "${{ secrets.IOS_PROFILE_BASE64 }}" | base64 -d > $RUNNER_TEMP/app.mobileprovision
          security create-keychain -p "$KP" $KC
          security set-keychain-settings -lut 21600 $KC
          security unlock-keychain -p "$KP" $KC
          security import $RUNNER_TEMP/cert.p12 -P "${{ secrets.IOS_CERTIFICATE_PASSWORD }}" -A -t cert -f pkcs12 -k $KC
          security set-key-partition-list -S apple-tool:,apple: -k "$KP" $KC
          security list-keychain -d user -s $KC
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $RUNNER_TEMP/app.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
      - name: Archive and export IPA
        if: env.CERT_BASE64 != ''
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -archivePath $RUNNER_TEMP/App.xcarchive -destination 'generic/platform=iOS' \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=${{ secrets.IOS_TEAM_ID }} \
            CODE_SIGN_IDENTITY="Apple Distribution" PROVISIONING_PROFILE_SPECIFIER="${{ secrets.IOS_PROFILE_NAME }}" archive
          cat > $RUNNER_TEMP/export.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${{ secrets.IOS_TEAM_ID }}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict>
              <key>com.aggregatequote.app</key><string>${{ secrets.IOS_PROFILE_NAME }}</string>
            </dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/export.plist -exportPath $RUNNER_TEMP/export
      - name: Upload to TestFlight
        if: env.CERT_BASE64 != ''
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.ASC_KEY_BASE64 }}" | base64 -d > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          xcrun altool --upload-app -t ios -f $RUNNER_TEMP/export/App.ipa \
            --apiKey ${{ secrets.ASC_KEY_ID }} --apiIssuer ${{ secrets.ASC_ISSUER_ID }}
